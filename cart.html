<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - ZELI</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .cart-item-row { display: flex; gap: 20px; border-bottom: 1px solid #eee; padding: 20px 0; align-items: start; }
        .cart-item-img { width: 100px; height: 120px; background: #f4f4f4; object-fit: cover; }
        .cart-item-info { flex: 1; }
        .cart-summary { margin-top: 30px; padding-top: 20px; border-top: 2px solid #000; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="nav-left">
        <img src="logo.png" alt="ZELI Logo" style="height: 40px; width: auto;">
         <span class="nav-brand-name">ZELI</span>
       
    
    </a>
    <div class="nav-right">
        <ul class="nav-links">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="about.html" class="nav-link">About</a></li>
            <li><a href="shop.html" class="nav-link">Shop</a></li>
        </ul>
        <a href="cart.html" class="nav-cart">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
        </a>
    </div>
</nav>

    <main class="cart-container">
        <h1 class="cart-title">Your Cart</h1>
        <div id="cart-items-list">
            </div>
        
        <div class="cart-summary">
            <h3>Total: <span id="cart-total">€ 0.00</span></h3>
            <a href="checkout.html" class="checkout-submit-btn" style="text-decoration:none; display:inline-block; padding: 15px 30px;">Proceed to Checkout</a>
        </div>
    </main>

    <script>
        const cart = JSON.parse(localStorage.getItem('zeli_cart')) || [];
        const container = document.getElementById('cart-items-list');
        const totalElement = document.getElementById('cart-total');
        let total = 0;

        if (cart.length === 0) {
            container.innerHTML = '<p>Your cart is empty.</p>';
        } else {
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                container.innerHTML += `
                    <div class="cart-item-row">
                        <img src="assets/pattern.png" class="cart-item-img" alt="Product">
                        <div class="cart-item-info">
                            <h3>${item.title}</h3>
                            <p>Color: ${item.color} | Size: ${item.size}</p>
                            <p>Quantity: ${item.quantity}</p>
                            <p><strong>€${itemTotal.toFixed(2)}</strong></p>
                        </div>
                    </div>
                `;
            });
        }
        totalElement.innerText = '€' + total.toFixed(2);
    </script>
</body>
</html>
