<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ZELI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="nav-left">
        <img src="Assets/logo.png" alt="ZELI Logo" style="height: 40px; width: auto;">
         <span class="nav-brand-name">ZELI</span>
       
    
    </a>
    <div class="nav-right">
        <ul class="nav-links">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="about.html" class="nav-link">About</a></li>
            <li><a href="shop.html" class="nav-link">Shop</a></li>
        </ul>
        <a href="cart.html" class="nav-cart">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
        </a>
    </div>
</nav>

    <main class="cart-container">
        <div class="cart-header">
            <h1 class="cart-title">Checkout</h1>
            <p class="cart-subtitle">Please enter your details to complete your order.</p>
        </div>

        <div class="cart-form" style="max-width: 600px; margin: 0 auto;">
            <form action="#" method="POST">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="firstname" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="lastname" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" required>
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" name="address" placeholder="Street and house number" required>
                </div>

                <div class="note-row" style="margin: 2rem 0; font-size: 0.9rem; color: #555;">
                    <p><em>Note: After receiving your order, we will personally contact you to discuss the details and shipping.</em></p>
                </div>

                <button type="submit" class="checkout-submit-btn">Place Order</button>
            </form>
        </div>
    </main>

</body>
</html>
