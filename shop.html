<!DOCTYPE html>

  <title>ZELI — Shop</title>
  <link rel="stylesheet" href="style.css">

<body>

<nav class="navbar">
    <a href="index.html" class="nav-left">
        <img src="Assets/logo.png" alt="ZELI Logo" style="height: 40px; width: auto;">

    </a>
    <div class="nav-right">

      <a href="product.html" class="product-card">
